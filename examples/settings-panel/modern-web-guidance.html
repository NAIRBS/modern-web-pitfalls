<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings Panel</title>
<!-- "light dark" = follow the system. The inline script below pins a stored override before first paint. -->
<meta name="color-scheme" content="light dark">
<script>
  // FOUC prevention only: keep this tiny, classic (not module/defer) and right after the <meta>.
  try {
    document.querySelector('meta[name="color-scheme"]').content =
      localStorage.getItem('color-scheme') ?? 'light dark';
  } catch {}
</script>
<style>
  /* ---------- Color scheme ---------- */
  :root {
    /* Base MUST stay "light dark"; the <meta> override is mapped back onto the property below. */
    color-scheme: light dark;

    &:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
    &:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }

    /* Raw tokens */
    --bg-light: #f6f7fb;       --bg-dark: #12131a;
    --surface-light: #ffffff;  --surface-dark: #1d1f2a;
    --text-light: #1b1d26;     --text-dark: #e8e9f0;
    --muted-light: #575b6b;    --muted-dark: #a6a9b8;
    --border-light: #767676;   --border-dark: #8a8d9c;
    --brand-light: #3b3fd8;    --brand-dark: #9fa6ff;
    --on-brand-light: #ffffff; --on-brand-dark: #14163a;
    --error-light: #b3261e;    --error-dark: #ffb4ab;
    --error-bg-light: #fce8e6; --error-bg-dark: #3a1714;
    --ok-light: #146c2e;       --ok-dark: #7dd99a;

    /* Fallback for browsers without light-dark(): follow the system... */
    --bg: var(--bg-light); --surface: var(--surface-light); --text: var(--text-light);
    --muted: var(--muted-light); --border: var(--border-light); --brand: var(--brand-light);
    --on-brand: var(--on-brand-light); --error: var(--error-light); --error-bg: var(--error-bg-light);
    --ok: var(--ok-light);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(:has(> head > meta[name="color-scheme"][content="light"])) {
      --bg: var(--bg-dark); --surface: var(--surface-dark); --text: var(--text-dark);
      --muted: var(--muted-dark); --border: var(--border-dark); --brand: var(--brand-dark);
      --on-brand: var(--on-brand-dark); --error: var(--error-dark); --error-bg: var(--error-bg-dark);
      --ok: var(--ok-dark);
    }
  }
  /* ...and honor an explicit dark override there too */
  :root:has(> head > meta[name="color-scheme"][content="dark"]) {
    --bg: var(--bg-dark); --surface: var(--surface-dark); --text: var(--text-dark);
    --muted: var(--muted-dark); --border: var(--border-dark); --brand: var(--brand-dark);
    --on-brand: var(--on-brand-dark); --error: var(--error-dark); --error-bg: var(--error-bg-dark);
    --ok: var(--ok-dark);
  }
  /* Modern path: light-dark() follows the computed color-scheme automatically */
  @supports (color: light-dark(white, black)) {
    :root:root {
      --bg: light-dark(var(--bg-light), var(--bg-dark));
      --surface: light-dark(var(--surface-light), var(--surface-dark));
      --text: light-dark(var(--text-light), var(--text-dark));
      --muted: light-dark(var(--muted-light), var(--muted-dark));
      --border: light-dark(var(--border-light), var(--border-dark));
      --brand: light-dark(var(--brand-light), var(--brand-dark));
      --on-brand: light-dark(var(--on-brand-light), var(--on-brand-dark));
      --error: light-dark(var(--error-light), var(--error-dark));
      --error-bg: light-dark(var(--error-bg-light), var(--error-bg-dark));
      --ok: light-dark(var(--ok-light), var(--ok-dark));
    }
  }

  :root { accent-color: var(--brand); }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
  }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .visually-hidden:where(:not(:focus-within, :active)) {
    position: absolute !important;
    clip-path: inset(50%) !important;
    overflow: hidden !important;
    width: 1px !important;
    height: 1px !important;
    margin: -1px !important;
    padding: 0 !important;
    border: 0 !important;
    white-space: nowrap !important;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0.5rem 1.5rem;
    border: 2px solid var(--brand);
    border-radius: 999px;
    background: var(--brand);
    color: var(--on-brand);
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ghost { background: transparent; color: var(--brand); }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100vh;   /* fallback */
    min-height: 100dvh;  /* tracks mobile browser UI showing/hiding */
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
    text-align: center;
    background:
      radial-gradient(circle at 20% 20%, color-mix(in oklab, var(--brand) 22%, transparent), transparent 55%),
      radial-gradient(circle at 80% 80%, color-mix(in oklab, var(--brand) 14%, transparent), transparent 50%),
      var(--bg);
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(2.25rem, 1.5rem + 4vw, 5rem); /* max <= 2.5x min keeps zoom working */
    line-height: 1.1;
    text-wrap: balance;
  }
  .hero p { margin: 0; max-width: 40ch; color: var(--muted); font-size: 1.125rem; }

  /* ---------- Dialog ---------- */
  dialog {
    width: min(32rem, calc(100% - 2rem));
    max-height: calc(100dvh - 2rem);
    padding: 0;
    border: 1px solid color-mix(in oklab, var(--border) 40%, transparent);
    border-radius: 1rem;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1.5rem 3rem rgb(0 0 0 / 0.25);

    /* Closed (exit) state + transitions. display/overlay keep it in the top layer while it fades out. */
    opacity: 0;
    transition-property: opacity, transform, display, overlay;
    transition-duration: 0.25s;
    transition-timing-function: ease-out;
    transition-behavior: allow-discrete; /* separate, so the shorthand isn't reset/dropped */

    @media (prefers-reduced-motion: no-preference) {
      transform: translateY(1rem) scale(0.96);
    }
  }

  /* Open state. :where(:not([data-closing])) lets the JS fallback run the exit transition
     while the dialog is still open, in browsers without overlay / display transitions. */
  dialog[open]:where(:not([data-closing])) {
    opacity: 1;

    @starting-style { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      transform: none;
      @starting-style { transform: translateY(1rem) scale(0.96); }
    }
  }

  dialog::backdrop {
    background-color: rgb(0 0 0 / 0);
    transition-property: background-color, display, overlay;
    transition-duration: 0.25s;
    transition-timing-function: ease-out;
    transition-behavior: allow-discrete;
    /* Make the backdrop a (non-scrollable) scroll container so it traps scroll chaining */
    overflow: hidden;
    overscroll-behavior: contain;
  }
  dialog[open]:where(:not([data-closing]))::backdrop {
    background-color: rgb(0 0 0 / 0.5);
    @starting-style { background-color: rgb(0 0 0 / 0); }
  }

  dialog:modal { overscroll-behavior: contain; }

  @media (prefers-reduced-motion: reduce) {
    dialog, dialog::backdrop { transition-duration: 0.1s; }
  }

  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.5rem 0;
  }
  .dialog-header h2 { margin: 0; font-size: 1.375rem; }
  .icon-btn {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .icon-btn:hover { background: color-mix(in oklab, var(--text) 10%, transparent); }

  .dialog-body { padding: 1rem 1.5rem 1.5rem; display: grid; gap: 1.5rem; }

  fieldset { margin: 0; padding: 0; border: 0; }
  legend { padding: 0; font-weight: 600; margin-block-end: 0.5rem; }

  /* Theme segmented control (native radios) */
  .theme-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
  }
  .theme-options label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 48px;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    cursor: pointer;
  }
  .theme-options label:has(:checked) {
    border-color: var(--brand);
    box-shadow: inset 0 0 0 1px var(--brand);
  }
  .theme-options input { margin: 0; }
  .theme-options small { display: block; color: var(--muted); font-size: 0.8125rem; }

  /* "System (currently …)" without JS, following the OS */
  .sys-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .sys-dark { display: inline; }
    .sys-light { display: none; }
  }

  /* Form fields */
  .field { display: flex; flex-direction: column; align-items: stretch; gap: 0.25rem; }
  .field + .field { margin-block-start: 1.25rem; }
  .field label { font-weight: 600; }
  .req { color: var(--error); }
  .hint { color: var(--muted); font-size: 0.875rem; }
  .field input {
    font-size: max(1rem, 1em);
    min-height: 48px;
    padding: 0.625rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background: var(--surface);
    color: var(--text);
  }
  #cc-exp { max-width: 9rem; }

  .error-msg {
    display: none;
    color: var(--error);
    font-size: 0.875rem;
  }
  .error-msg svg { vertical-align: -0.2em; margin-inline-end: 0.25rem; }

  /* Errors only after the user has interacted (blurred an edited field or tried to submit) */
  .field input:is(:user-invalid, .user-invalid-fallback) {
    border-color: var(--error);
    border-width: 2px;
    background-color: var(--error-bg);
  }
  .field input:is(:user-invalid, .user-invalid-fallback) + .error-msg { display: block; }
  .field input:is(:user-valid, .user-valid-fallback) { border-color: var(--ok); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 0.75rem;
    margin-block-start: 1.5rem;
  }
  .status { margin: 0; margin-inline-end: auto; color: var(--ok); font-weight: 600; min-height: 1.5em; }

  hr { border: 0; border-top: 1px solid color-mix(in oklab, var(--border) 35%, transparent); margin: 0; }
</style>
</head>
<body>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <h1 id="hero-title">Make it yours</h1>
    <p>Pick a theme and keep your account details up to date.</p>
    <!-- Declarative open via Invoker Commands; a small script below covers browsers without it. -->
    <button type="button" class="btn" id="open-settings" command="show-modal" commandfor="settings">
      Settings
    </button>
  </section>
</main>

<!-- Native modal: no role/aria-modal/focus trap needed. closedby="any" adds click-outside dismissal. -->
<dialog id="settings" aria-labelledby="settings-title" closedby="any">
  <div class="dialog-header">
    <h2 id="settings-title">Settings</h2>
    <button type="button" class="icon-btn" id="close-settings" aria-label="Close settings">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="dialog-body">
    <!-- Theme applies immediately and persists; it is not part of the account form. -->
    <fieldset class="theme">
      <legend>Theme</legend>
      <div class="theme-options">
        <label>
          <input type="radio" name="theme" value="light dark">
          <span>System <small>Currently <span class="sys-light">light</span><span class="sys-dark">dark</span></small></span>
        </label>
        <label>
          <input type="radio" name="theme" value="light">
          <span>Light</span>
        </label>
        <label>
          <input type="radio" name="theme" value="dark">
          <span>Dark</span>
        </label>
      </div>
    </fieldset>

    <hr>

    <form id="account-form" action="#" method="post" aria-labelledby="account-title">
      <h3 id="account-title" class="visually-hidden">Account details</h3>

      <div class="field">
        <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
        <span id="email-hint" class="hint">Format: you@example.com</span>
        <input
          type="email" id="email" name="email"
          required autocomplete="email"
          autocorrect="off" autocapitalize="none" spellcheck="false"
          enterkeyhint="next"
          aria-describedby="email-hint" data-error="email-error"
          autofocus
        >
        <div id="email-error" class="error-msg">
          <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Error"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4.5M8 11.2v.3" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="error-text">Enter an email address in the format you@example.com.</span>
        </div>
      </div>

      <div class="field">
        <label for="cc-exp">Card expiry date <span class="req" aria-hidden="true">*</span></label>
        <!-- Hint sits above the input so autofill popovers and keyboards don't hide it -->
        <span id="exp-hint" class="hint">Format: MM/YY, for example 08/29</span>
        <input
          type="text" id="cc-exp" name="cc-exp"
          required autocomplete="cc-exp"
          inputmode="numeric" maxlength="5"
          pattern="(0[1-9]|1[0-2])/[0-9]{2}"
          placeholder="MM/YY"
          enterkeyhint="done"
          aria-describedby="exp-hint" data-error="exp-error"
        >
        <div id="exp-error" class="error-msg">
          <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Error"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4.5M8 11.2v.3" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="error-text">Enter the expiry date as MM/YY, for example 08/29.</span>
        </div>
      </div>

      <div class="actions">
        <p class="status" id="save-status" role="status"></p>
        <button type="button" class="btn btn-ghost" id="cancel-settings">Cancel</button>
        <button type="submit" class="btn">Save changes</button>
      </div>
    </form>
  </div>
</dialog>

<script>
(() => {
  const dialog = document.getElementById('settings');
  const openBtn = document.getElementById('open-settings');
  const form = document.getElementById('account-form');
  const status = document.getElementById('save-status');

  /* ---------- Opening: Invoker Commands, with a no-dependency fallback ---------- */
  if (!('commandForElement' in HTMLButtonElement.prototype)) {
    openBtn.addEventListener('click', () => { if (!dialog.open) dialog.showModal(); });
  }

  /* ---------- Animated closing ---------- */
  let supportsDisplayTransition;
  function canTransitionDisplay() {
    if (supportsDisplayTransition !== undefined) return supportsDisplayTransition;
    if (!window.CSS?.supports?.('transition-behavior', 'allow-discrete') || !document.body) return false;
    const probe = document.createElement('div');
    probe.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
    document.body.appendChild(probe);
    getComputedStyle(probe).display;
    probe.style.display = 'none';
    supportsDisplayTransition = getComputedStyle(probe).display === 'block';
    probe.remove();
    return supportsDisplayTransition;
  }
  const supportsTopLayerExit = () => window.CSS?.supports?.('overlay', 'auto') && canTransitionDisplay();

  async function closeDialog() {
    if (!dialog.open || dialog.hasAttribute('data-closing')) return;
    if (!supportsTopLayerExit()) {
      dialog.setAttribute('data-closing', '');
      const animations = dialog.getAnimations({ subtree: true });
      if (animations.length > 0) {
        await Promise.race([
          Promise.allSettled(animations.map((a) => a.finished)),
          new Promise((r) => setTimeout(r, 2000)),
        ]);
      }
      if (!dialog.hasAttribute('data-closing')) return;
      dialog.removeAttribute('data-closing');
    }
    dialog.close();
  }

  // Route Esc / back gesture / closedby light dismiss through the animated close
  dialog.addEventListener('cancel', (event) => {
    event.preventDefault();
    closeDialog();
  });
  document.getElementById('close-settings').addEventListener('click', closeDialog);
  document.getElementById('cancel-settings').addEventListener('click', closeDialog);

  // closedby="any" fallback (e.g. Safari): close on press + release outside the dialog box
  if (!('closedBy' in HTMLDialogElement.prototype)) {
    const outside = (e) => {
      const r = dialog.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    };
    let pressedOutside = false;
    dialog.addEventListener('pointerdown', (e) => { pressedOutside = outside(e); });
    dialog.addEventListener('pointerup', (e) => { if (pressedOutside && outside(e)) closeDialog(); });
  }

  dialog.addEventListener('close', () => { status.textContent = ''; });

  /* ---------- Theme: System / Light / Dark, persisted ---------- */
  const meta = document.querySelector('meta[name="color-scheme"]');
  const radios = [...document.querySelectorAll('input[name="theme"]')];

  const readStored = () => {
    try { return localStorage.getItem('color-scheme'); } catch { return null; }
  };
  const applyScheme = (value) => {
    meta.content = value ?? 'light dark';
    for (const r of radios) r.checked = r.value === meta.content;
  };

  applyScheme(readStored());

  for (const radio of radios) {
    radio.addEventListener('change', () => {
      const value = radio.value;
      // Theme still applies even if storage is blocked
      try {
        if (value === 'light dark') localStorage.removeItem('color-scheme');
        else localStorage.setItem('color-scheme', value);
      } catch {}
      applyScheme(value === 'light dark' ? null : value);
    });
  }

  // Keep other tabs in sync
  window.addEventListener('storage', (e) => {
    if (e.key === 'color-scheme' || e.key === null) applyScheme(readStored());
  });

  /* ---------- Validation messages ---------- */
  const email = document.getElementById('email');
  const exp = document.getElementById('cc-exp');

  const setErrorText = (el, text) => {
    document.getElementById(el.dataset.error).querySelector('.error-text').textContent = text;
  };

  function validateEmail() {
    const v = email.validity;
    if (v.valueMissing) setErrorText(email, 'Enter your email address, for example you@example.com.');
    else if (v.typeMismatch) setErrorText(email, 'Enter an email address in the format you@example.com, with an @ and a domain.');
  }

  function validateExpiry() {
    exp.setCustomValidity('');
    const v = exp.validity;
    if (v.valueMissing) {
      setErrorText(exp, 'Enter the card expiry date as MM/YY, for example 08/29.');
    } else if (v.patternMismatch) {
      const month = Number(exp.value.slice(0, 2));
      setErrorText(exp, /^\d{2}/.test(exp.value) && (month < 1 || month > 12)
        ? 'Enter a month between 01 and 12, then the year, for example 08/29.'
        : 'Enter the expiry date as MM/YY, for example 08/29.');
    } else {
      // Card is valid through the last day of its expiry month
      const [mm, yy] = exp.value.split('/').map(Number);
      const now = new Date();
      const expYear = 2000 + yy;
      const expired = expYear < now.getFullYear() ||
        (expYear === now.getFullYear() && mm < now.getMonth() + 1);
      if (expired) {
        const msg = 'This card has expired. Enter the expiry date of a current card.';
        exp.setCustomValidity(msg);
        setErrorText(exp, msg);
      }
    }
  }

  // Insert the slash as the user types digits: "0829" -> "08/29"
  exp.addEventListener('input', (e) => {
    if (e.inputType?.startsWith('delete')) return;
    const digits = exp.value.replace(/\D/g, '').slice(0, 4);
    let next = digits;
    if (digits.length === 1 && Number(digits) > 1) next = `0${digits}/`;
    else if (digits.length >= 2) next = `${digits.slice(0, 2)}/${digits.slice(2)}`;
    if (next !== exp.value) exp.value = next;
  });

  email.addEventListener('input', validateEmail);
  exp.addEventListener('input', validateExpiry);
  validateEmail();
  validateExpiry();

  /* ---------- Keep ARIA in sync with :user-invalid ---------- */
  const hasUserInvalid = CSS.supports('selector(:user-invalid)');
  const dirty = new WeakSet();
  const isUserInvalid = (el) => hasUserInvalid
    ? el.matches(':user-invalid')
    : dirty.has(el) && !el.validity.valid;

  const linkError = (el, shown) => {
    const errorId = el.dataset.error;
    if (!errorId) return;
    const ids = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter((id) => id && id !== errorId);
    if (shown) ids.push(errorId);
    if (ids.length) el.setAttribute('aria-describedby', ids.join(' '));
    else el.removeAttribute('aria-describedby');
  };

  const announcer = document.createElement('div');
  announcer.setAttribute('aria-live', 'polite');
  announcer.className = 'visually-hidden';
  dialog.append(announcer); // inside the modal so it isn't inert
  let announceTimer;
  let announcedField;
  const spokenText = (node) => {
    const copy = node.cloneNode(true);
    copy.querySelectorAll('[aria-hidden="true"]').forEach((n) => n.remove());
    copy.querySelectorAll('[role="img"][aria-label]').forEach((n) => n.replaceWith(`${n.getAttribute('aria-label')}: `));
    return copy.textContent.replace(/\s+/g, ' ').trim();
  };
  const announceError = (el) => {
    const error = document.getElementById(el.dataset.error);
    const label = el.labels?.[0] ? `${spokenText(el.labels[0])}: ` : '';
    clearTimeout(announceTimer);
    announcer.textContent = '';
    announcedField = el;
    announceTimer = setTimeout(() => { announcer.textContent = label + spokenText(error); }, 500);
  };

  const flagged = new WeakSet();
  const announced = new WeakSet();
  const fields = [email, exp];

  const syncAria = (el, announce = false) => {
    if (!fields.includes(el)) return;
    const invalid = isUserInvalid(el);
    if (!hasUserInvalid) {
      el.classList.toggle('user-invalid-fallback', invalid);
      el.classList.toggle('user-valid-fallback', dirty.has(el) && !invalid);
    }
    if (invalid) {
      if (announce && !announced.has(el)) { announceError(el); announced.add(el); }
      el.setAttribute('aria-invalid', 'true');
      linkError(el, true);
      flagged.add(el);
    } else {
      el.setAttribute('aria-invalid', 'false');
      linkError(el, false);
      flagged.delete(el);
      announced.delete(el);
      if (announcedField === el) { clearTimeout(announceTimer); announcer.textContent = ''; }
    }
  };

  fields.forEach((el) => syncAria(el));
  form.addEventListener('blur', (e) => {
    if (e.target.value !== '') dirty.add(e.target);
    syncAria(e.target, true);
  }, true);
  form.addEventListener('input', (e) => { syncAria(e.target); status.textContent = ''; });
  form.addEventListener('invalid', (e) => {
    dirty.add(e.target);
    announced.add(e.target); // focus moves to the first invalid field, which reads its error
    syncAria(e.target);
  }, true);

  /* ---------- Save ---------- */
  form.addEventListener('submit', (e) => {
    e.preventDefault(); // demo: no server; native validation already blocked invalid submits
    status.textContent = 'Settings saved.';
  });
})();
</script>
</body>
</html>
